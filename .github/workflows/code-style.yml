name: Code style

on:
  push:
  pull_request:

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check code style
        run: python tools/style.py check --github
