name: Visual Studio 6

on:
  push:
  pull_request:

jobs:
  vc6:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out VC6
        uses: actions/checkout@v4
        with:
          repository: FLHDE/VC6-SP6-Enterprise
          ref: a4ceccb3c60b4315d1e097215658e70753241820
          path: VC6-SP6-Enterprise

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate VC6 projects
        run: python tools/vc2005_to_vc6.py src/BOD.sln

      - name: Build solution
        shell: cmd
        run: >-
           VC6-SP6-Enterprise\Common\MSDev98\Bin\MSDEV.EXE src\BOD.dsw
           /MAKE "ALL - Win32 Release"
